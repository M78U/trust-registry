name: Manual release validation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Resolve locks, generate tested candidates or validate committed locks (no deployment)"
        type: choice
        options:
          - lock-candidate
          - lock-only
          - locked
        default: lock-candidate
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate both modules, CLI and Explorer
        env:
          VALIDATION_MODE: ${{ inputs.mode }}
        run: node scripts/validate-release.mjs --mode="$VALIDATION_MODE" --report-dir=.release-validation
      - name: Preserve validation report, dependency candidates and license evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-validation/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
