name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Bootstrap dependency checksums on this PR only; replace with readonly checks before merge.
      - run: go mod tidy
      - run: go mod verify
      - name: Show resolved dependency checksums
        shell: bash
        run: cat go.mod go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
