name: CI
on:
  # Automatic PR/push checks suspended by project owner during development.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy -diff
      - run: go mod verify
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
      - run: go build -mod=readonly ./...
