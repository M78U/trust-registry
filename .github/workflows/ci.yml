name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # Temporary dependency bootstrap; restore tidy -diff after locking checksums.
      - run: go mod tidy
      - name: Resolved module lock
        shell: bash
        run: cat go.mod go.sum
      - run: go mod verify
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly ./...
      - run: go build -mod=readonly ./...
